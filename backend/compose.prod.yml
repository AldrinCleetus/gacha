services:
  postgres:
    image: postgres:16-alpine
    container_name: gacha_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-gacha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gacha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  migrate:
    build:
      context: .
      target: runner
    container_name: gacha_prod_migrate
    command: ["node", "packages/db/dist/migrate.js"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gacha}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      target: runner
    container_name: gacha_prod_api
    command: ["node", "--max-old-space-size=384", "apps/api/dist/index.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gacha}
      RAW_STORAGE_DRIVER: local
      RAW_STORAGE_PATH: /app/data/raw
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in production}
      TZ: UTC
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - raw_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  worker:
    build:
      context: .
      target: runner
    container_name: gacha_prod_worker
    command: ["node", "--max-old-space-size=384", "apps/worker/dist/index.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gacha}
      RAW_STORAGE_DRIVER: local
      RAW_STORAGE_PATH: /app/data/raw
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TZ: UTC
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - raw_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: gacha_prod_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - api
    networks:
      - internal

volumes:
  postgres_data:
  raw_data:
  caddy_data:
  caddy_config:

networks:
  internal:
