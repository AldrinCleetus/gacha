services:
  postgres:
    image: postgres:16-alpine
    container_name: gacha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gacha}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gacha}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: dev
    container_name: gacha_migrate
    command: pnpm --filter @gacha/db db:migrate
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gacha}
      TZ: UTC
    volumes:
      - ./packages/db/src:/app/packages/db/src
      - ./packages/db/drizzle:/app/packages/db/drizzle
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: dev
    container_name: gacha_api
    command: pnpm --filter @gacha/api dev
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gacha}
      RAW_STORAGE_DRIVER: local
      RAW_STORAGE_PATH: /app/data/raw
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev_admin_token}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      TZ: UTC
    ports:
      - "3001:3001"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/sources/src:/app/packages/sources/src
      - ./packages/db/src:/app/packages/db/src
      - ./apps/api/src:/app/apps/api/src
      - raw_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    container_name: gacha_worker
    command: pnpm --filter @gacha/worker dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gacha}
      RAW_STORAGE_DRIVER: local
      RAW_STORAGE_PATH: /app/data/raw
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev_admin_token}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      TZ: UTC
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/sources/src:/app/packages/sources/src
      - ./packages/db/src:/app/packages/db/src
      - ./apps/worker/src:/app/apps/worker/src
      - raw_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  raw_data:
